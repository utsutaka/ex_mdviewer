<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>mdviewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #1e1e1e;
        color: #ffffff;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }

      .app-name {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0.3;
        animation: dot-pulse 1.2s ease-in-out infinite;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dot-pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-name">mdviewer</div>
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </body>
</html>
