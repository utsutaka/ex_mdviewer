<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>mdviewer - タブバー</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <style>
      /* 033-webcontentsview-search-fix: View全体（body）を.tab-bar-wrapperで埋める */
      body {
        display: flex;
        height: 100vh;
      }
      .tab-bar-wrapper {
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <div class="tab-bar-wrapper">
      <button type="button" class="tab-bar-scroll-btn tab-bar-scroll-btn--left" aria-label="タブを左にスクロール" hidden></button>
      <div id="tab-bar" class="tab-bar"></div>
      <button type="button" class="tab-bar-scroll-btn tab-bar-scroll-btn--right" aria-label="タブを右にスクロール" hidden></button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
