<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>mdviewer - 目次</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <style>
      /* 033-webcontentsview-search-fix: base.css/.sidebar-tocのflexスタイルは既存の
         .workspace（flexコンテナ）の子要素であることを前提にしているため、
         View単体のbody直下ではflex: 0 0 var(--toc-width)が効かない。
         Viewのboundsはmainプロセス側で既にTOC幅ぴったりに設定されるため、
         ここではView全体（body）を埋めるだけでよい。 */
      body {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }
      .sidebar-toc {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <nav id="sidebar-toc" class="sidebar-toc" aria-label="目次">
      <div id="sidebar-toc-search" class="sidebar-toc-search"></div>
      <div id="sidebar-toc-list" class="sidebar-toc-list"></div>
    </nav>
    <div id="toc-resize-handle" class="toc-resize-handle" role="separator" aria-orientation="vertical" aria-label="目次の幅を変更"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
